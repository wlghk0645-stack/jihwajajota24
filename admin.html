<body class="p-4 md:p-6 lg:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- 헤더 -->
    <div class="flex items-center justify-between pb-4 border-b border-gray-200">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">⚙️</span>
        <h1 class="text-xl md:text-2xl font-bold">학생 포인트 관리 패널 (클라우드 동기화)</h1>

    <!-- 실시간 접속 진단 대시보드 (오류 상황을 실시간으로 분석해 줌) -->
    <div id="statusDashboard" class="bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-center justify-between">

    <!-- 구체적인 서버 에러 발생 시 노출되는 디버깅 안내창 -->
    <div id="errorDetailsBox" class="hidden bg-rose-50 border border-rose-200 text-rose-900 rounded-2xl p-5 space-y-3">

        <p><strong>[서버 메시지]</strong> <span id="errMessageText">-</span></p>
      </div>
    </div>

    <!-- 전체 정보 일괄 수정 (Form) -->
    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider">👥 학생 명단 & 기본 점수 (8명)</h2>
        <button id="resetBtn" class="text-xs text-red-500 hover:text-red-700 underline font-medium">기본 샘플 복구</button>
      </div>
      
      <!-- 입력 폼 컨테이너 -->
      <div id="modalInputContainer" class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-3 mb-5 max-h-[300px] overflow-y-auto pr-1">
        <div class="col-span-2 text-center py-6 text-gray-400">데이터를 실시간 연결 중입니다...</div>
      </div>
    </div>

    <!-- 실시간 조정 패널 -->
    <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm">
      <h2 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-4">⚡ 실시간 점수 조정 (+/-10p)</h2>
      
      <!-- 실시간 리스트 컨테이너 -->
      <div id="liveAdjustmentList" class="space-y-2 max-h-[400px] overflow-y-auto pr-1">
        <div class="text-center py-6 text-gray-400">데이터를 실시간 연결 중입니다...</div>
      </div>

  </div>

  <!-- Firebase 모듈을 이용한 실시간 클라우드 저장 및 제어 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let firebaseConfig = {};
    let appId = 'my-notion-widget';

    // 🔴 사용자님의 Firebase 실시간 인증 정보 탑재 완료
    const MY_PRIVATE_FIREBASE_CONFIG = {
      apiKey: "AIzaSyDsjN0ERiMC3BAqEy7tkkMNZisONmKAKbE",
      authDomain: "notion-ranking.firebaseapp.com",
      projectId: "notion-ranking",
      storageBucket: "notion-ranking.firebasestorage.app",
      messagingSenderId: "85799241871",
      appId: "1:85799241871:web:e935d33f834bfc4d0308fa"
    };

    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        firebaseConfig = JSON.parse(__firebase_config);
      } else {
        firebaseConfig = MY_PRIVATE_FIREBASE_CONFIG;
      }
    } catch (e) {
      firebaseConfig = MY_PRIVATE_FIREBASE_CONFIG;
    }

    try {
      if (typeof __app_id !== 'undefined' && __app_id) {
        appId = __app_id;
      }
    } catch (e) {
      appId = 'my-notion-widget';
    }

    // 대시보드 상태 제어 함수
    function updateStatus(state, title, desc) {
      const dashboard = document.getElementById('statusDashboard');
      const icon = document.getElementById('statusIcon');
      const titleEl = document.getElementById('statusTitle');
      const descEl = document.getElementById('statusDesc');
      const badge = document.getElementById('statusBadge');

      if (state === 'error') {
        dashboard.className = "bg-rose-50 border border-rose-200 rounded-xl p-4 flex items-center justify-between";
        icon.innerText = "❌";
        badge.className = "px-2.5 py-1 text-[10px] font-bold rounded-full bg-rose-100 text-rose-800";
        badge.innerText = "ERROR";
      } else if (state === 'success') {
        dashboard.className = "bg-emerald-50 border border-emerald-200 rounded-xl p-4 flex items-center justify-between";
        icon.innerText = "✅";
        badge.className = "px-2.5 py-1 text-[10px] font-bold rounded-full bg-emerald-100 text-emerald-800";
        badge.innerText = "CONNECTED";
      } else {
        dashboard.className = "bg-blue-50 border border-blue-200 rounded-xl p-4 flex items-center justify-between";
        icon.innerText = "📡";
        badge.className = "px-2.5 py-1 text-[10px] font-bold rounded-full bg-blue-100 text-blue-800";
        badge.innerText = "CONNECTING";
      }
      titleEl.innerText = title;
      descEl.innerText = desc;
    }

    // 구체적인 에러 화면 표시 분석 시스템
    function showDiagnostics(error, actionContext) {
      const errorBox = document.getElementById('errorDetailsBox');
      const friendlyMsg = document.getElementById('friendlyErrorMsg');
      const errCode = document.getElementById('errCodeText');
      const errMsg = document.getElementById('errMessageText');

      errorBox.classList.remove('hidden');
      errCode.innerText = error.code || '알 수 없음';
      errMsg.innerText = error.message || error;

      let msg = `[${actionContext}] 중 서버에서 오류를 반환했습니다. <br>`;
      
      if (error.code === 'permission-denied') {
        msg += "👉 <strong>원인: 접근 권한 거부.</strong><br>Firebase 콘솔의 <strong>Firestore Database ➔ [규칙(Rules)]</strong> 탭에 들어가셔서 접근 규칙 코드가 <code class='bg-rose-100 px-1 rounded'>allow read, write: if true;</code> 로 적용되어 있는지 확인하시고, 우측 상단의 파란색 <strong>[게시(Publish)]</strong> 버튼을 반드시 눌렀는지 확인하세요.";
      } else if (error.code === 'auth/operation-not-allowed') {
        msg += "👉 <strong>원인: 익명 로그인 차단됨.</strong><br>Firebase 콘솔의 <strong>Authentication ➔ [Sign-in method(로그인 방법)]</strong>에서 <strong>[익명(Anonymous)]</strong> 공급업체를 찾아 <strong>[사용 설정(활성화)]</strong>을 켜고 저장해 주세요.";
      } else if (error.code === 'invalid-argument' || error.message?.includes('API key')) {
        msg += "👉 <strong>원인: Firebase 연결 설정값 오류.</strong><br>코드의 설정값에 오타가 있거나 복사 붙여넣기가 정상적으로 되지 않았는지 꼼꼼히 대조해 주세요.";
      } else {
        msg += "👉 설정값 오타, 네트워크 오류 혹은 아직 데이터베이스가 생성되지 않았을 수 있습니다. Firebase 콘솔에서 'Firestore Database'를 제대로 개설하셨는지 점검해 주세요.";
      }

      friendlyMsg.innerHTML = msg;
      updateStatus('error', '클라우드 통신 실패', '아래의 구체적인 진단 오류를 보고 수정해 주세요.');
    }

    let students = [];

    // 초기 샘플 데이터 (8명)
    const DEFAULT_STUDENTS = [
      { id: 1, name: '김지훈', points: 150 }, { id: 2, name: '이서윤', points: 120 }, { id: 3, name: '박민재', points: 110 },
      { id: 4, name: '최예은', points: 90 }, { id: 5, name: '정준우', points: 80 }, { id: 6, name: '한서현', points: 70 },
      { id: 7, name: '윤지민', points: 50 }, { id: 8, name: '강하준', points: 30 }
    ];

    let db;
    let auth;
    let docRef;

    async function startFirebaseApp() {
      try {
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);
        docRef = doc(db, 'artifacts', appId, 'public', 'data', 'scores', 'students_doc');

        updateStatus('connecting', '인증 서버 접속 중...', '보안 식별자 등록을 위해 익명 로그인을 시도하고 있습니다.');
        const authenticated = await startAuth();
        
        if (!authenticated) {
          return; // 내부에서 진단 상자를 이미 그림
        }

        onAuthStateChanged(auth, (user) => {
          if (!user) return;

          updateStatus('connecting', '실시간 대기 중...', '클라우드 서버에서 학생 명단 데이터를 받아오고 있습니다.');
          
          // 클라우드 실시간 동기화 바인딩
          onSnapshot(docRef, (docSnap) => {
            document.getElementById('errorDetailsBox').classList.add('hidden'); // 에러 풀리면 숨김
            if (docSnap.exists()) {
              students = docSnap.data().students || [];
            } else {
              // 문서가 비어있다면 초기 샘플 자동 생성 시도
              students = [...DEFAULT_STUDENTS];
              setDoc(docRef, { students }).catch(err => showDiagnostics(err, '초기 데이터베이스 생성'));
            }
            updateStatus('success', '클라우드 실시간 연동 성공', '현재 기기와 노션 위젯 간 실시간 동기화가 활성화되었습니다.');
            renderAdminView();
          }, (error) => {
            showDiagnostics(error, '실시간 데이터 읽기(onSnapshot)');
          });
        });
      } catch (err) {
        showDiagnostics(err, 'Firebase 앱 초기화(initializeApp)');
      }
    }

    // 인증 실행
    async function startAuth() {
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        return true;
      } catch (e) {
        try {
          await signInAnonymously(auth);
          return true;
        } catch (err) {
          showDiagnostics(err, '익명 인증 로그인(Authentication)');
          return false;
        }
      }
    }

    // 관리자 UI 갱신 함수
    function renderAdminView() {
      renderFormInputs();
      renderLiveList();
    }

    // 1. 일괄 수정 폼 생성 (인풋 포커스를 잃지 않도록 동적 엘리먼트 유지 설계)
    function renderFormInputs() {
      const container = document.getElementById('modalInputContainer');
      
      // 사용자 입력 중에 인풋 필드가 초기화되는 것을 막기 위해 값이 없는 상태일 때만 재생성
      const hasActiveFocus = document.activeElement && document.activeElement.tagName === 'INPUT';
      if (hasActiveFocus) {
        // 이미 폼이 그려져 있다면 개별 인풋의 값만 부드럽게 업데이트
        students.forEach(student => {
          const nameInput = document.getElementById(`edit-name-${student.id}`);
          const pointsInput = document.getElementById(`edit-points-${student.id}`);
          if (nameInput && nameInput !== document.activeElement) nameInput.value = student.name;
          if (pointsInput && pointsInput !== document.activeElement) pointsInput.value = student.points;
        });
        return;
      }

      container.innerHTML = '';
      const currentStudents = [...students].sort((a, b) => a.id - b.id);

      currentStudents.forEach((student) => {
        const item = document.createElement('div');
        item.className = 'grid grid-cols-10 gap-2 items-center bg-gray-50 p-2.5 rounded-lg border border-gray-100';
        item.innerHTML = `
          <div class="col-span-1 text-center font-bold text-xs text-gray-400">${student.id}</div>
          <div class="col-span-5">
            <input type="text" id="edit-name-${student.id}" value="${escapeHtml(student.name)}" class="w-full px-3 py-1.5 text-sm font-semibold rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-300 focus:outline-none transition-all" placeholder="학생 이름">
          </div>
          <div class="col-span-4 relative flex items-center">
            <input type="number" id="edit-points-${student.id}" value="${student.points}" min="0" class="w-full pl-3 pr-7 py-1.5 text-sm text-right font-bold rounded-lg border border-gray-200 focus:ring-2 focus:ring-blue-300 focus:outline-none transition-all" placeholder="점수">
            <span class="absolute right-2.5 text-xs text-gray-400 font-bold pointer-events-none">p</span>
          </div>
        `;
        container.appendChild(item);
      });
    }

    // 2. 실시간 +/- 조정 리스트 UI 생성
    function renderLiveList() {
      const listContainer = document.getElementById('liveAdjustmentList');
      listContainer.innerHTML = '';

      const currentStudents = [...students].sort((a, b) => a.id - b.id);

      currentStudents.forEach((student) => {
        const row = document.createElement('div');
        row.className = 'flex items-center justify-between p-3 rounded-lg border border-gray-100 bg-white hover:bg-gray-50 transition-colors';

        row.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="font-bold text-xs text-gray-400">${student.id}</span>
            <span class="font-bold text-sm text-gray-700">${escapeHtml(student.name)}</span>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <span class="text-base font-extrabold text-gray-900">${student.points}</span>
              <span class="text-[10px] text-gray-400 font-medium ml-0.5">p</span>
            </div>
            <div class="flex items-center gap-1.5">
              <button data-id="${student.id}" data-amount="-10" class="adjust-btn px-2.5 py-1.5 rounded-lg bg-red-50 text-red-600 font-bold text-xs hover:bg-red-100 active:scale-95 transition-all" title="10포인트 감소">
                -10
              </button>
              <button data-id="${student.id}" data-amount="10" class="adjust-btn px-2.5 py-1.5 rounded-lg bg-green-50 text-green-600 font-bold text-xs hover:bg-green-100 active:scale-95 transition-all" title="10포인트 추가">
                +10
              </button>
            </div>
          </div>
        `;
        listContainer.appendChild(row);
      });

      // 실시간 조정 버튼 클릭 이벤트 리스너 할당
      document.querySelectorAll('.adjust-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          const id = parseInt(e.currentTarget.getAttribute('data-id'));
          const amount = parseInt(e.currentTarget.getAttribute('data-amount'));
          await changePoints(id, amount);
        });
      });
    }

    // 실시간 점수 즉각 변경 및 클라우드 업로드
    async function changePoints(id, amount) {
      const index = students.findIndex(s => s.id === id);
      if (index !== -1) {
        students[index].points = Math.max(0, students[index].points + amount);
        try {
          await setDoc(docRef, { students });
        } catch (err) {
          showDiagnostics(err, '실시간 포인트 수정');
        }
      }
    }

    // 폼 일괄 정보 저장
    async function saveAllEdits() {
      const newStudents = [];
      for (let i = 1; i <= 8; i++) {
        const nameInput = document.getElementById(`edit-name-${i}`);
        const pointsInput = document.getElementById(`edit-points-${i}`);

        if (nameInput && pointsInput) {
          const name = nameInput.value.trim() || `학생 ${i}`;
          let points = parseInt(pointsInput.value);
          if (isNaN(points) || points < 0) points = 0;

          newStudents.push({ id: i, name: name, points: points });
        }
      }

      students = newStudents;
      try {
        await setDoc(docRef, { students });
        alert('모든 정보가 클라우드에 성공적으로 저장되었으며, 노션 위젯에 실시간 동기화되었습니다!');
      } catch (err) {
        showDiagnostics(err, '전체 저장');
      }
    }

    // 샘플 복구 기능
    async function resetData() {
      if(!confirm('모든 학생 정보를 샘플용 기본값으로 초기화하시겠습니까?')) return;
      students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
      try {
        await setDoc(docRef, { students });
        alert('성공적으로 데이터가 리셋되었습니다!');
      } catch (err) {
        showDiagnostics(err, '샘플 데이터 초기화');
      }
    }

    // 특수문자 안전 처리
    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 이벤트 리스너 바인딩 및 시작
    document.getElementById('saveBtn').addEventListener('click', saveAllEdits);
    document.getElementById('resetBtn').addEventListener('click', resetData);
    
    // 시작점 트리거
    startFirebaseApp();
  </script>
</body>
</html>
