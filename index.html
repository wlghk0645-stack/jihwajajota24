<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 포인트 순위 위젯</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Pretendard 프리미엄 한국어 폰트 적용 -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'Roboto', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    /* 플로팅 텍스트 애니메이션 효과 */
    @keyframes floatUp {
      0% {
        opacity: 0;
        transform: translateY(0) scale(0.8);
      }
      20% {
        opacity: 1;
        transform: translateY(-10px) scale(1.1);
      }
      100% {
        opacity: 0;
        transform: translateY(-30px) scale(0.9);
      }
    }
    .float-indicator {
      animation: floatUp 0.8s ease-out forwards;
    }
    /* 스크롤바 커스텀 */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: #4b5563;
      border-radius: 9999px;
    }
    .light ::-webkit-scrollbar-thumb {
      background: #d1d5db;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-gray-50 dark:bg-[#191919] text-gray-800 dark:text-gray-200 min-h-screen flex justify-center items-start p-4 md:p-6 select-none">

  <!-- 위젯 전체 카드 -->
  <div class="w-full max-w-xl bg-white dark:bg-[#202020] rounded-2xl border border-gray-200 dark:border-[#2f2f2f] shadow-sm overflow-hidden p-5 md:p-6 transition-all duration-300">
    
    <!-- 헤더 영역 -->
    <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100 dark:border-[#2f2f2f]">
      <div class="flex items-center gap-2.5">
        <span class="text-2xl">🏆</span>
        <div>
          <h1 class="text-lg md:text-xl font-bold tracking-tight text-gray-900 dark:text-white">실시간 포인트 순위</h1>
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">실시간으로 반영되는 학생 포인트 랭킹</p>
        </div>
      </div>
      
      <!-- 헤더 컨트롤 버튼들 -->
      <div class="flex items-center gap-2">
        <!-- 다크모드 토글 버튼 -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg bg-gray-100 dark:bg-[#2c2c2c] hover:bg-gray-200 dark:hover:bg-[#373737] transition-colors" title="화면 테마 변경">
          <svg id="themeDarkIcon" class="w-4 h-4 text-gray-600 dark:text-gray-300 hidden" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464a1 1 0 10-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z"></path></svg>
          <svg id="themeLightIcon" class="w-4 h-4 text-gray-600 dark:text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
        </button>
        <!-- 편집 버튼 -->
        <button onclick="openEditModal()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40 hover:bg-blue-100 dark:hover:bg-blue-900/40 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor">
            <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z" />
          </svg>
          일괄 편집
        </button>
      </div>
    </div>

    <!-- 순위 포디움 영역 (1위 ~ 3위 시각화) -->
    <div class="mb-8">
      <h2 class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider mb-4">🏆 명예의 전당 (Top 3)</h2>
      <div class="grid grid-cols-3 gap-3 items-end pt-4 px-2 min-h-[140px]">
        
        <!-- 2위 포디움 -->
        <div id="podium-2" class="flex flex-col items-center order-1 transition-all duration-500 transform">
          <span class="text-xs font-bold text-gray-500 dark:text-gray-400 mb-1">2nd</span>
          <div class="w-full bg-gradient-to-t from-gray-100 to-gray-50 dark:from-[#2a2a2a] dark:to-[#252525] border border-gray-200 dark:border-[#333333] rounded-t-xl p-3 text-center shadow-sm">
            <div id="podium-2-name" class="font-bold text-sm text-gray-700 dark:text-gray-200 truncate">-</div>
            <div id="podium-2-points" class="text-xs text-blue-500 dark:text-blue-400 font-semibold mt-1">0p</div>
          </div>
        </div>

        <!-- 1위 포디움 (가장 높게) -->
        <div id="podium-1" class="flex flex-col items-center order-2 transition-all duration-500 transform -translate-y-2">
          <span class="text-xl mb-1 filter drop-shadow">👑</span>
          <div class="w-full bg-gradient-to-t from-yellow-500/10 to-yellow-500/5 dark:from-yellow-500/15 dark:to-transparent border border-yellow-400/50 dark:border-yellow-500/30 rounded-t-xl p-3.5 text-center shadow-md relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-1 bg-yellow-400"></div>
            <div id="podium-1-name" class="font-extrabold text-base text-yellow-800 dark:text-yellow-400 truncate">-</div>
            <div id="podium-1-points" class="text-sm font-bold text-yellow-600 dark:text-yellow-300 mt-1">0p</div>
          </div>
        </div>

        <!-- 3위 포디움 -->
        <div id="podium-3" class="flex flex-col items-center order-3 transition-all duration-500 transform">
          <span class="text-xs font-bold text-amber-700 dark:text-amber-600 mb-1">3rd</span>
          <div class="w-full bg-gradient-to-t from-orange-50/80 to-transparent dark:from-orange-950/10 dark:to-transparent border border-orange-200 dark:border-orange-950/50 rounded-t-xl p-3 text-center shadow-sm">
            <div id="podium-3-name" class="font-bold text-sm text-gray-700 dark:text-gray-200 truncate">-</div>
            <div id="podium-3-points" class="text-xs text-orange-500 dark:text-orange-400 font-semibold mt-1">0p</div>
          </div>
        </div>

      </div>
    </div>

    <!-- 전체 학생 목록 & 실시간 조정 패널 -->
    <div>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-xs font-bold text-gray-400 dark:text-gray-500 uppercase tracking-wider">👥 실시간 점수 조정 (8인)</h2>
        <button onclick="resetAllPoints()" class="text-xs text-gray-400 hover:text-red-500 dark:text-gray-500 dark:hover:text-red-400 transition-colors flex items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 8H17" />
          </svg>
          점수 리셋
        </button>
      </div>

      <!-- 학생 목록 컨테이너 -->
      <div id="studentsList" class="space-y-2 max-h-[360px] overflow-y-auto pr-1">
        <!-- JS로 동적 생성됨 -->
      </div>
    </div>

  </div>

  <!-- 일괄 편집 모달 (Modal) -->
  <div id="editModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white dark:bg-[#202020] rounded-2xl max-w-lg w-full p-6 border border-gray-200 dark:border-[#2f2f2f] shadow-2xl transform scale-95 transition-transform duration-300">
      
      <div class="flex justify-between items-center mb-5 pb-3 border-b border-gray-100 dark:border-[#2f2f2f]">
        <div>
          <h3 class="text-lg font-bold text-gray-900 dark:text-white">학생 정보 일괄 수정</h3>
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-0.5">8명 학생의 이름과 포인트를 직접 수정할 수 있습니다.</p>
        </div>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 p-1.5 rounded-lg hover:bg-gray-100 dark:hover:bg-[#2c2c2c] transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- 편집 폼 영역 -->
      <div class="max-h-[300px] overflow-y-auto pr-1 space-y-3 mb-6" id="modalInputContainer">
        <!-- JS로 입력 필드 8개 동적 생성 -->
      </div>

      <!-- 하단 제어 -->
      <div class="flex justify-between items-center pt-3 border-t border-gray-100 dark:border-[#2f2f2f]">
        <button onclick="fillSampleData()" class="px-3 py-2 text-xs font-medium rounded-lg text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#2c2c2c] transition-colors">
          기본 학생 로드
        </button>
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="px-4 py-2 text-sm font-medium rounded-lg bg-gray-100 dark:bg-[#2c2c2c] hover:bg-gray-200 dark:hover:bg-[#373737] text-gray-700 dark:text-gray-200 transition-colors">
            취소
          </button>
          <button onclick="saveAllEdits()" class="px-4 py-2 text-sm font-semibold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow-sm hover:shadow transition-all">
            적용하기
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- 위젯용 커스텀 심플 토스트 메시지 -->
  <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-gray-900/90 text-white px-4 py-2 rounded-full text-xs font-semibold shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none z-50">
    포인트가 변경되었습니다.
  </div>

  <script>
    // 기본 탑재 학생 데이터 (8명)
    const DEFAULT_STUDENTS = [
      { id: 1, name: '김지훈', points: 150 },
      { id: 2, name: '이서윤', points: 120 },
      { id: 3, name: '박민재', points: 110 },
      { id: 4, name: '최예은', points: 90 },
      { id: 5, name: '정준우', points: 80 },
      { id: 6, name: '한서현', points: 70 },
      { id: 7, name: '윤지민', points: 50 },
      { id: 8, name: '강하준', points: 30 }
    ];

    // 상태 관리 데이터
    let students = [];

    // 초기 실행
    window.onload = function() {
      // 로컬 스토리지에 데이터가 있으면 로드, 없으면 기본 데이터 사용 (사용자 세션 보존용)
      const savedData = localStorage.getItem('notion_widget_points');
      if (savedData) {
        try {
          students = JSON.parse(savedData);
          if (!Array.isArray(students) || students.length !== 8) {
            students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
          }
        } catch (e) {
          students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
        }
      } else {
        students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
      }

      // 시스템 다크모드 감지 및 적용
      const systemTheme = localStorage.getItem('theme');
      if (systemTheme === 'dark' || (!systemTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        document.getElementById('themeDarkIcon').classList.remove('hidden');
        document.getElementById('themeLightIcon').classList.add('hidden');
      } else {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeDarkIcon').classList.add('hidden');
        document.getElementById('themeLightIcon').classList.remove('hidden');
      }

      updateWidget();
    };

    // 테마 설정 함수
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      
      const darkIcon = document.getElementById('themeDarkIcon');
      const lightIcon = document.getElementById('themeLightIcon');

      if (isDark) {
        darkIcon.classList.remove('hidden');
        lightIcon.classList.add('hidden');
      } else {
        darkIcon.classList.add('hidden');
        lightIcon.classList.remove('hidden');
      }
    }

    // 포인트 변화 시 데이터 보존 및 UI 업데이트
    function saveData() {
      localStorage.setItem('notion_widget_points', JSON.stringify(students));
    }

    // 포인트를 조절하는 핵심 액션 (버튼 및 Floating 이펙트 지원)
    function changePoints(id, amount, event) {
      const index = students.findIndex(s => s.id === id);
      if (index !== -1) {
        // 포인트 음수 방지 (최소 0점)
        const oldPoints = students[index].points;
        const newPoints = Math.max(0, oldPoints + amount);
        students[index].points = newPoints;
        
        saveData();
        updateWidget();

        // 텍스트 상승 피드백 이펙트 생성
        if (event && event.currentTarget) {
          createFloatingText(event.currentTarget, amount);
        }
      }
    }

    // 마우스 클릭 시 화면에 솟아오르는 이펙트 텍스트 생성
    function createFloatingText(targetBtn, amount) {
      const rect = targetBtn.getBoundingClientRect();
      const indicator = document.createElement('div');
      
      indicator.className = 'absolute z-50 float-indicator text-xs font-black tracking-wider';
      indicator.style.left = `${rect.left + rect.width / 2}px`;
      indicator.style.top = `${rect.top - 10}px`;
      
      if (amount > 0) {
        indicator.innerText = `+${amount}`;
        indicator.style.color = '#10b981'; // 초록빛
      } else {
        indicator.innerText = `${amount}`;
        indicator.style.color = '#f43f5e'; // 분홍/빨강빛
      }

      document.body.appendChild(indicator);

      // 애니메이션 종료 시 자동 제거
      setTimeout(() => {
        indicator.remove();
      }, 800);
    }

    // 전체 위젯 화면 갱신
    function updateWidget() {
      // 1. 순위 계산을 위한 정렬 (점수 기준 내림차순, 동일 점수일 시 이름 가나다 순)
      const sortedStudents = [...students].sort((a, b) => {
        if (b.points !== a.points) {
          return b.points - a.points;
        }
        return a.name.localeCompare(b.name, 'ko');
      });

      // 2. 포디움 (Top 3) 업데이트
      const top1 = sortedStudents[0];
      const top2 = sortedStudents[1];
      const top3 = sortedStudents[2];

      // 1등 업데이트 (앞에 👑 추가)
      const p1NameEl = document.getElementById('podium-1-name');
      p1NameEl.innerHTML = top1 ? `👑 ${escapeHtml(top1.name)}` : '-';
      document.getElementById('podium-1-points').innerText = top1 ? `${top1.points}p` : '0p';
      
      // 2등 업데이트
      document.getElementById('podium-2-name').innerText = top2 ? escapeHtml(top2.name) : '-';
      document.getElementById('podium-2-points').innerText = top2 ? `${top2.points}p` : '0p';

      // 3등 업데이트
      document.getElementById('podium-3-name').innerText = top3 ? escapeHtml(top3.name) : '-';
      document.getElementById('podium-3-points').innerText = top3 ? `${top3.points}p` : '0p';

      // 3. 학생 전원 리스트 업데이트 (여기서도 실시간 등수 표기)
      const listContainer = document.getElementById('studentsList');
      listContainer.innerHTML = '';

      sortedStudents.forEach((student, index) => {
        const rank = index + 1;
        
        // 등수 메달 또는 뱃지 디자인 분기
        let rankBadge = '';
        if (rank === 1) {
          rankBadge = `<span class="w-6 h-6 rounded-full bg-yellow-400 text-yellow-950 font-bold flex items-center justify-center text-xs shadow-sm">1</span>`;
        } else if (rank === 2) {
          rankBadge = `<span class="w-6 h-6 rounded-full bg-gray-200 text-gray-800 dark:bg-gray-700 dark:text-gray-100 font-bold flex items-center justify-center text-xs shadow-sm">2</span>`;
        } else if (rank === 3) {
          rankBadge = `<span class="w-6 h-6 rounded-full bg-amber-600 text-white font-bold flex items-center justify-center text-xs shadow-sm">3</span>`;
        } else {
          rankBadge = `<span class="w-6 h-6 rounded-full bg-gray-100 text-gray-500 dark:bg-[#2a2a2a] dark:text-gray-400 font-medium flex items-center justify-center text-xs">${rank}</span>`;
        }

        // 1등 학생 이름 앞에도 왕관 이모지 추가
        const displayName = rank === 1 ? `👑 ${escapeHtml(student.name)}` : escapeHtml(student.name);

        const row = document.createElement('div');
        row.className = `flex items-center justify-between p-3 rounded-xl border transition-all duration-300 ${
          rank === 1 
          ? 'bg-yellow-500/5 dark:bg-yellow-500/5 border-yellow-200/60 dark:border-yellow-500/20' 
          : 'bg-white dark:bg-[#252525] border-gray-100 dark:border-[#2b2b2b] hover:border-gray-200 dark:hover:border-[#353535]'
        }`;

        row.innerHTML = `
          <div class="flex items-center gap-3">
            ${rankBadge}
            <span class="font-bold text-sm text-gray-700 dark:text-gray-200">${displayName}</span>
          </div>
          <div class="flex items-center gap-4">
            <!-- 포인트 수치 영역 -->
            <div class="text-right">
              <span class="text-sm font-extrabold text-gray-900 dark:text-white">${student.points}</span>
              <span class="text-[10px] text-gray-400 font-medium ml-0.5">p</span>
            </div>
            
            <!-- 직관적인 실시간 조절 버튼 셋 -->
            <div class="flex items-center gap-1">
              <button onclick="changePoints(${student.id}, -10, event)" class="w-8 h-8 rounded-lg flex items-center justify-center bg-rose-50 dark:bg-rose-950/30 text-rose-600 dark:text-rose-400 font-bold text-xs hover:bg-rose-100 dark:hover:bg-rose-900/30 active:scale-95 transition-all" title="10포인트 감소">
                -10
              </button>
              <button onclick="changePoints(${student.id}, 10, event)" class="w-8 h-8 rounded-lg flex items-center justify-center bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 font-bold text-xs hover:bg-emerald-100 dark:hover:bg-emerald-900/30 active:scale-95 transition-all" title="10포인트 추가">
                +10
              </button>
            </div>
          </div>
        `;
        listContainer.appendChild(row);
      });
    }

    // 모달 다이얼로그 열기 및 폼 바인딩
    function openEditModal() {
      const container = document.getElementById('modalInputContainer');
      container.innerHTML = '';

      // ID 순서대로 인풋 필드 정렬 생성
      const currentStudents = [...students].sort((a, b) => a.id - b.id);

      currentStudents.forEach((student) => {
        const item = document.createElement('div');
        item.className = 'grid grid-cols-12 gap-3 items-center bg-gray-50 dark:bg-[#1a1a1a] p-3 rounded-xl border border-gray-100 dark:border-[#2b2b2b]';
        item.innerHTML = `
          <div class="col-span-1 text-center font-bold text-xs text-gray-400 dark:text-gray-500">
            ${student.id}
          </div>
          <div class="col-span-6">
            <input type="text" id="edit-name-${student.id}" value="${escapeHtml(student.name)}" class="w-full px-3 py-1.5 text-sm font-semibold rounded-lg bg-white dark:bg-[#252525] border border-gray-200 dark:border-[#333] text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" placeholder="학생 이름">
          </div>
          <div class="col-span-5">
            <div class="relative flex items-center">
              <input type="number" id="edit-points-${student.id}" value="${student.points}" min="0" class="w-full pl-3 pr-8 py-1.5 text-sm text-right font-bold rounded-lg bg-white dark:bg-[#252525] border border-gray-200 dark:border-[#333] text-gray-800 dark:text-gray-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all" placeholder="점수">
              <span class="absolute right-3 text-xs text-gray-400 dark:text-gray-500 font-bold pointer-events-none">p</span>
            </div>
          </div>
        `;
        container.appendChild(item);
      });

      const modal = document.getElementById('editModal');
      modal.classList.remove('opacity-0', 'pointer-events-none');
      modal.querySelector('div').classList.remove('scale-95');
    }

    // 모달 다이얼로그 닫기
    function closeEditModal() {
      const modal = document.getElementById('editModal');
      modal.classList.add('opacity-0', 'pointer-events-none');
      modal.querySelector('div').classList.add('scale-95');
    }

    // 모달에서 작성한 데이터 일괄 적용 및 유효성 검사
    function saveAllEdits() {
      const newStudents = [];
      for (let i = 1; i <= 8; i++) {
        const nameInput = document.getElementById(`edit-name-${i}`);
        const pointsInput = document.getElementById(`edit-points-${i}`);

        if (nameInput && pointsInput) {
          const name = nameInput.value.trim() || `학생 ${i}`;
          let points = parseInt(pointsInput.value);
          if (isNaN(points) || points < 0) points = 0;

          newStudents.push({
            id: i,
            name: name,
            points: points
          });
        }
      }

      students = newStudents;
      saveData();
      updateWidget();
      closeEditModal();
      showToast('모든 정보가 정상적으로 업데이트 되었습니다!');
    }

    // 기본 학생 샘플 데이터 강제 복구
    function fillSampleData() {
      students = JSON.parse(JSON.stringify(DEFAULT_STUDENTS));
      saveData();
      updateWidget();
      closeEditModal();
      showToast('샘플 데이터가 로드되었습니다.');
    }

    // 점수 전원 리셋 (0점으로 일괄 변경)
    function resetAllPoints() {
      students.forEach(s => s.points = 0);
      saveData();
      updateWidget();
      showToast('모든 학생의 점수가 0p로 초기화되었습니다.');
    }

    // 단순 문자 탈출 처리 (XSS 방지)
    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 위젯 내 심플 토스트 메시지 시스템
    let toastTimeout;
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.innerText = message;
      toast.classList.remove('opacity-0');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2500);
    }
  </script>
</body>
</html>
